# ============================================================
# Step2: 同期バックエンド(API サーバー + PostgreSQL + Web版アプリ)
#   起動:   docker compose up -d --build
#   停止:   docker compose down        (データは volume に保持)
#   破棄:   docker compose down -v     (サーバー側データも削除)
#
# サーバーにはクライアント側で暗号化済みのデータのみが保存される
# (ゼロ知識: サーバーは暗号化キーを一切持たない)
# 認証はアカウント制(アプリ内から新規登録 / ログイン)
#
# api イメージは Web版アプリ(web/)も同梱してビルドする
# (server/Dockerfile が electron/・src/hooks/ の共有ロジックも
# 参照するため、ビルドコンテキストはリポジトリルートにしている)
# 起動後は http://localhost:8787/ で Web版に直接アクセスできる
#
# 外部公開(zettelnote.hol-tec.net)とLet's EncryptによるTLS終端は、
# このホスト上で稼働中のk3s(Traefik + cert-manager)側のIngressで
# 行う。設定は k8s/ ディレクトリ、または deploy時の kubectl 適用を参照。
# (ホストの80/443番はTraefikが既に専有しているため、docker-compose
#  側では8787番をホストへ公開するだけに留める)
# ============================================================
services:
  # api・api2 は同じイメージ・同じdbに繋がる2台構成(本番のみ)。
  # k8s/zettelnote.yaml 側でこの2つのホストポート両方をEndpointsに
  # 登録しており、Serviceがラウンドロビンする。片方ずつ再起動すれば
  # 常にどちらかが生きたままデプロイできる(scripts/deploy-prod.sh参照)
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      DATABASE_URL: postgres://zettel:zettel@db:5432/zettel
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8787/api/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api2:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8791:8787"
    environment:
      PORT: 8787
      DATABASE_URL: postgres://zettel:zettel@db:5432/zettel
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8787/api/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zettel
      POSTGRES_PASSWORD: zettel
      POSTGRES_DB: zettel
    volumes:
      - zettel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zettel -d zettel"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 製品紹介ページ(zettelnote.top のルートで公開)。中身はアプリ本体(api)とは
  # 無関係な静的サイトなので別コンテナに分けている。landing/ の中身はすべて
  # 相対パスなので、ここではprefixの付け外し(k8s Ingress側のstripPrefix)は不要
  landing:
    build:
      context: .
      dockerfile: landing/Dockerfile
    ports:
      - "8790:80"
    restart: unless-stopped

  # ログ収集サイドカー(tmp/今後のタスクリスト.md「ログの永続化と
  # ローテーション」参照)。docker.sock経由でapi・api2・landingの
  # 標準出力ログを継続的に読み取り、./logs 配下へ永続化・日次
  # ローテーションする。対象コンテナ自身にはファイル書き込み・
  # ローテーションのロジックを持たせていない(api/api2の2台構成でも、
  # 各コンテナが個別にファイル・ローテーションを管理する必要が無い)
  logsidecar:
    build:
      context: ./logsidecar
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/logs
    environment:
      TARGET_CONTAINERS: "zettelnote-landing-1 zettelnote-api-1 zettelnote-api2-1"
    restart: unless-stopped

volumes:
  zettel-db:
