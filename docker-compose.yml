# ============================================================
# Step2: 同期バックエンド(API サーバー + PostgreSQL + Web版アプリ)
#   起動:   docker compose up -d --build
#   停止:   docker compose down        (データは volume に保持)
#   破棄:   docker compose down -v     (サーバー側データも削除)
#
# サーバーにはクライアント側で暗号化済みのデータのみが保存される
# (ゼロ知識: サーバーは暗号化キーを一切持たない)
# 認証はアカウント制(アプリ内から新規登録 / ログイン)
#
# api イメージは Web版アプリ(web/)も同梱してビルドする
# (server/Dockerfile が electron/・src/hooks/ の共有ロジックも
# 参照するため、ビルドコンテキストはリポジトリルートにしている)
# 起動後は http://localhost:8787/ で Web版に直接アクセスできる
#
# 外部公開(zettelnote.hol-tec.net)とLet's EncryptによるTLS終端は、
# このホスト上で稼働中のk3s(Traefik + cert-manager)側のIngressで
# 行う。設定は k8s/ ディレクトリ、または deploy時の kubectl 適用を参照。
# (ホストの80/443番はTraefikが既に専有しているため、docker-compose
#  側では8787番をホストへ公開するだけに留める)
# ============================================================
services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      DATABASE_URL: postgres://zettel:zettel@db:5432/zettel
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zettel
      POSTGRES_PASSWORD: zettel
      POSTGRES_DB: zettel
    volumes:
      - zettel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zettel -d zettel"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 製品紹介ページ(zettelnote.top のルートで公開)。中身はアプリ本体(api)とは
  # 無関係な静的サイトなので別コンテナに分けている。landing/ の中身はすべて
  # 相対パスなので、ここではprefixの付け外し(k8s Ingress側のstripPrefix)は不要
  landing:
    build:
      context: .
      dockerfile: landing/Dockerfile
    ports:
      - "8790:80"
    restart: unless-stopped

volumes:
  zettel-db:
