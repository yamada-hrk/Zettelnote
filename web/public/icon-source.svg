<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12162a"/>
      <stop offset="100%" stop-color="#0b0d14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- ベース: ダークネイビーの角丸正方形(アプリのベースカラーと統一) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- モチーフ: つながるメモ(ツェッテルカステンの概念)を3つの結節点+線で表現 -->
  <g stroke="url(#accent)" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <line x1="176" y1="176" x2="336" y2="256"/>
    <line x1="336" y1="256" x2="196" y2="356"/>
    <line x1="176" y1="176" x2="196" y2="356"/>
  </g>
  <circle cx="176" cy="176" r="30" fill="url(#accent)"/>
  <circle cx="336" cy="256" r="38" fill="url(#accent)"/>
  <circle cx="196" cy="356" r="26" fill="url(#accent)"/>
</svg>
