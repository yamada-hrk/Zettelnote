# copytruncateを使う理由: collect.shは追記(>>)し続けているだけで、
# ファイルがリネームされても reopen するシグナルハンドラを持たない。
# copytruncateなら「現在の内容を退避してから元のファイルを空にする」
# ため、書き込み側のファイルディスクリプタを維持したまま安全に
# ローテーションできる(退避〜空にするまでの一瞬に書かれた数行が
# 失われる可能性はあるが、この用途では許容する)
/logs/*/access.log {
  daily
  rotate 14
  compress
  missingok
  notifempty
  copytruncate
}
